name: Audit public IGVF figure inputs
on:
  push:
    branches: [audit/igvf-input-crosswalk-20261031]
    paths: [.github/workflows/igvf-input-audit.yml, .github/igvf_input_audit.py]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas h5py fsspec aiohttp
      - name: Audit public metadata and scientific file contents
        run: python .github/igvf_input_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: igvf-manuscript-input-deep-audit
          path: /tmp/igvf-input-audit
          retention-days: 7
