name: Validate figure notebooks
on:
  push:
    branches: [curation/figure-reproduction-v1]
    paths: ['src/**', 'notebooks/**', 'scripts/**', 'config/**', 'tests/**', 'data/figure_02/**', '.gitattributes', '.github/workflows/validate-figure-second-pass.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-notebook-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural validation dependencies
        run: python -m pip install PyYAML nbformat
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate JSON, nbformat and all Python code cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import nbformat
          failures = []
          for path in sorted(Path('src/cc_perturbseq').glob('*.py')):
              try:
                  text = path.read_text(encoding='utf-8')
                  ast.parse(text, filename=str(path))
                  compile(text, str(path), 'exec')
              except Exception as exc:
                  failures.append(f'{path}: {type(exc).__name__}: {exc}')
          for path in sorted(Path('notebooks').rglob('*.ipynb')):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  nb = nbformat.from_dict(payload)
                  nbformat.validate(nb)
                  for index, cell in enumerate(nb.cells):
                      if cell.cell_type == 'code' and cell.source.strip():
                          compile(cell.source, f'{path}:cell-{index}', 'exec')
              except Exception as exc:
                  failures.append(f'{path}: {type(exc).__name__}: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('PASS: JSON, notebook schema, modules and code cells')
          PY
      - name: Static preflight for Figures 1 through 4
        run: python scripts/preflight_main_figure_notebooks.py
