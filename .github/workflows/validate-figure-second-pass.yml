name: Validate figure notebooks

on:
  push:
    branches:
      - curation/figure-reproduction-v1
    paths:
      - "src/cc_perturbseq/**"
      - "notebooks/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "data/figure_02/**"
      - ".gitattributes"
      - ".github/workflows/validate-figure-second-pass.yml"
  workflow_dispatch:

jobs:
  syntax-and-notebook-validation:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML \
            pytest \
            nbformat \
            nbclient \
            numpy \
            pandas \
            scipy \
            matplotlib \
            seaborn
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Compile Python modules and notebook code cells
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path
          import sys

          failures: list[str] = []

          for path in sorted(Path("src/cc_perturbseq").glob("*.py")):
              try:
                  source = path.read_text(encoding="utf-8")
                  ast.parse(source, filename=str(path))
                  compile(source, str(path), "exec")
              except Exception as exc:
                  failures.append(f"{path}: {type(exc).__name__}: {exc}")

          for path in sorted(Path("notebooks").rglob("*.ipynb")):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  if payload.get("nbformat") != 4:
                      failures.append(
                          f"{path}: unexpected nbformat={payload.get('nbformat')}"
                      )
                      continue
                  for index, cell in enumerate(payload.get("cells", [])):
                      if cell.get("cell_type") != "code":
                          continue
                      source = cell.get("source", "")
                      if isinstance(source, list):
                          source = "".join(source)
                      if not source.strip():
                          continue
                      ast.parse(source, filename=f"{path}:cell-{index}")
                      compile(source, f"{path}:cell-{index}", "exec")
              except Exception as exc:
                  failures.append(f"{path}: {type(exc).__name__}: {exc}")

          if failures:
              print("Validation failures:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print(
              "All Python modules and notebook code cells parsed and "
              "compiled successfully."
          )
          PY
      - name: Run retained supplementary runtime tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_source_notebook_runner.py \
            tests/test_supplementary_notebook_scope.py \
            tests/test_figure_s02_parse_mix.py \
            tests/test_s4_source_runner.py \
            tests/test_motif_source_contract.py
      - name: Static preflight for Figures 1 through 4
        run: python scripts/preflight_main_figure_notebooks.py
