name: Validate study GEO accession settings
on:
  push:
    branches: [publication/geo-accessions-352893-352939]
    paths: ['.publication/**', '.github/workflows/geo-accessions-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare source edits against published main
        run: |
          cp .publication/update_geo_accessions.py /tmp/update_geo_accessions.py
          cp .publication/test_study_geo_accessions.py /tmp/test_study_geo_accessions.py
          cp .publication/gate_geo_settings.py /tmp/gate_geo_settings.py
          git checkout --detach d15c64ae5cc0392bf50d425dcef458fc3f26930a
          python -m pip install -r config/geo-reproduction-requirements.txt
          python /tmp/update_geo_accessions.py
          cp /tmp/test_study_geo_accessions.py tests/test_study_geo_accessions.py
          python /tmp/gate_geo_settings.py
      - name: Run all public input and compact export tests
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee /tmp/geo-accession-tests.log
          python scripts/audit_public_inputs.py | tee /tmp/geo-accession-portability.json
      - name: Check anonymous metadata discovery without downloading study matrices
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from cc_perturbseq.geo_download import GeoClient
          records=[]
          for dataset, accession in [('ipsc_k562_mix','GSE352893'),('hippo_timecourse','GSE352939')]:
              item={'dataset':dataset,'accession':accession,'checked_utc':datetime.now(timezone.utc).isoformat(),'matrix_downloaded':False}
              try:
                  item.update(GeoClient(timeout=15).discover(accession,dataset=dataset))
                  item['status']='processed_file_metadata_resolved'
              except (FileNotFoundError,ValueError,RuntimeError,TimeoutError) as exc:
                  item.update(status='not_resolved',error=f'{type(exc).__name__}: {exc}')
              print(json.dumps(item),flush=True)
              records.append(item)
          Path('/tmp/geo-accession-live-discovery.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Verify commit scope and preserve saved figures
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          expected=['README.md','docs/PUBLIC_DATA.md','data/geo/README.md','notebooks/main/Figure_03.ipynb','notebooks/main/Figure_04.ipynb','notebooks/supplementary/Figure_S02.ipynb','tests/test_geo_plot_notebooks.py','tests/test_study_geo_accessions.py']
          for path in expected:
              if path.endswith('.ipynb'):
                  blob=subprocess.check_output(['git','hash-object','-w','--no-filters',path],text=True).strip()
                  subprocess.run(['git','update-index','--add','--cacheinfo',f'100644,{blob},{path}'],check=True)
              else:
                  subprocess.run(['git','add','--',path],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual)==set(expected),(actual,expected)
          for record in json.loads(Path('/tmp/geo-accession-preservation.json').read_text()):
              notebook=json.loads(subprocess.check_output(['git','show',':'+record['path']]))
              for cell in notebook['cells']:cell['source']=None
              digest=hashlib.sha256(json.dumps(notebook,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
              assert digest==record['outputs_execution_counts_metadata_sha256'],record['path']
          PY
          git diff --cached --check
          git config user.name 'Tri Nguyen'
          git config user.email '72826864+edtnguyen@users.noreply.github.com'
          git commit -m 'Configure GEO accessions for Hippo and mixed-cell figure regeneration' -m 'Set GSE352893 for mixed iPSC-K562 Figure S2 and GSE352939 for Hippo Figures 3f/4c. Forward configured accessions only in GEO download mode, retain precomputed defaults and saved outputs, and update README and public-data instructions. Test actual assigned-accession routing and distinguish mocked tests from live file availability.'
          git push origin HEAD:refs/heads/publication/geo-accessions-352893-352939-tested
          git rev-parse HEAD | tee /tmp/geo-accession-candidate.txt
      - name: Collect validation evidence
        if: always()
        run: |
          mkdir -p /tmp/geo-accession-evidence
          cp /tmp/geo-accession-tests.log /tmp/geo-accession-preservation.json /tmp/geo-accession-portability.json /tmp/geo-accession-live-discovery.json /tmp/geo-accession-candidate.txt /tmp/geo-accession-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geo-accession-validation
          path: /tmp/geo-accession-evidence
          retention-days: 7
