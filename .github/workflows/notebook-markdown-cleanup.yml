name: Clean published figure notebook markdown

on:
  push:
    branches: [cleanup/figure-notebook-markdown]
    paths: [.github/workflows/notebook-markdown-cleanup.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract cleanup script and apply it to current main
        run: |
          python - <<'PY'
          from pathlib import Path

          payload = Path('.github/notebook-markdown-cleanup-payload.txt').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(payload) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(payload)) if payload[i].strip() == 'PY')
          body = payload[start + 1:end]
          first = next(line for line in body if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in body) + '\n'
          Path('/tmp/clean_figure_notebook_markdown.py').write_text(script, encoding='utf-8')
          compile(script, '/tmp/clean_figure_notebook_markdown.py', 'exec')
          PY
          git fetch origin main
          git checkout --detach origin/main
          python /tmp/clean_figure_notebook_markdown.py
      - name: Verify scope and commit candidate
        run: |
          expected=$(cat <<'EOF'
          notebooks/main/Figure_01.ipynb
          notebooks/main/Figure_02.ipynb
          notebooks/main/Figure_03.ipynb
          notebooks/main/Figure_04.ipynb
          notebooks/supplementary/Figure_S02.ipynb
          notebooks/supplementary/Figure_S04.ipynb
          notebooks/supplementary/Figure_S06.ipynb
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          git config user.name 'Tri Nguyen'
          git config user.email '72826864+edtnguyen@users.noreply.github.com'
          git add notebooks/main notebooks/supplementary
          git commit -m 'Present figure notebooks as manuscript reproduction workflows' -m 'Rewrite markdown in Figures 1-4, S2, S4, and S6 to describe scientific inputs, calculations, filters, and outputs without internal reconstruction history. Code cells, execution counts, and embedded outputs are unchanged.'
          git push --force origin HEAD:refs/heads/cleanup/figure-notebook-markdown-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: figure-notebook-markdown-cleanup-report
          path: /tmp/markdown_cleanup_report.json
          retention-days: 3
