name: Compact plot inputs
on:
  push:
    branches: [publication/compact-plot-inputs]
    paths: ['.github/workflows/compact-plot-inputs.yml', '.compact/**']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and apply compact export patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, subprocess, tempfile
          fix=Path('.compact/fix.py').read_bytes()
          Path('/tmp/compact-fix.py').write_bytes(fix)
          parts=[]
          expected=['3ac0f798af7976edd8b0b2ac2e594bba8050a580d4a65e899f10a0f6fee1e1d8','8ac2a77fb625774c72ddc11928387df34f778d1dd88ef1606c306e9db00b5b7a']
          for i,h in enumerate(expected,1):
              s=Path(f'.compact/payload.{i}.b64').read_text().strip()
              assert hashlib.sha256(s.encode()).hexdigest()==h, f'Payload part {i} changed'
              parts.append(s)
          data=lzma.decompress(base64.b64decode(''.join(parts)))
          assert hashlib.sha256(data).hexdigest()=='f700f0647d62747947f2949782f75b57c52385e08cad0bae16479a81520a711d'
          payload=json.loads(data)
          assert payload['base']=='7ba32392c2f7491cd5e1b355e34ecedc0815ef26'
          subprocess.run(['git','checkout','--detach',payload['base']],check=True)
          changed=[]
          for spec in payload['files']:
              p=Path(spec['path'])
              assert not p.is_absolute() and '..' not in p.parts
              if spec['before'] is None:
                  assert not p.exists()
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(spec['content'])
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==spec['before'],str(p)
                  Path('/tmp/compact-change.patch').write_text(spec['patch'])
                  subprocess.run(['patch','--batch','--fuzz=0','-p1','-i','/tmp/compact-change.patch'],check=True)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==spec['after'],str(p)
              changed.append(str(p))
          Path('/tmp/compact-changed.json').write_text(json.dumps(changed))
          PY
          python /tmp/compact-fix.py
      - name: Install pinned scientific dependencies
        run: python -m pip install -r config/geo-reproduction-requirements.txt
      - name: Test both compact routes and all public-data workflows
        run: |
          set -o pipefail
          python -m pytest -q tests --basetemp=/tmp/compact-tests 2>&1 | tee /tmp/compact-tests.log
          python scripts/audit_public_inputs.py | tee /tmp/compact-static-audit.json
          python scripts/export_compact_plot_data.py --help > /tmp/compact-cli-help.txt
      - name: Preserve notebooks and publish tested candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          expected=json.loads(Path('/tmp/compact-changed.json').read_text())
          for path in expected:
              subprocess.run(['git','add','--',path],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(expected),(staged,expected)
          report=[]
          for p in [*Path('notebooks/main').glob('*.ipynb'),*Path('notebooks/supplementary').glob('*.ipynb')]:
              before=subprocess.check_output(['git','show',f'HEAD:{p}'])
              assert before==p.read_bytes(),str(p)
              report.append({'path':str(p),'sha256':hashlib.sha256(before).hexdigest(),'unchanged_including_outputs':True})
          assert len(report)==7
          Path('/tmp/compact-notebooks-preserved.json').write_text(json.dumps(report,indent=2))
          PY
          git diff --cached --check
          git config user.name 'Tri Nguyen'
          git config user.email '72826864+edtnguyen@users.noreply.github.com'
          git commit -m 'Export compact plotting intermediates without building integrated H5MUs' -m 'Add explicit source-file and saved-table routes, preserve original Hippo producers and S2 per-cell metrics, reuse the precomputed notebook schema, report actual export sizes and verify readback. Keep full GEO regeneration available. No study data or notebooks are replaced.'
          git push origin HEAD:refs/heads/publication/compact-plot-inputs-reviewed
          git rev-parse HEAD > /tmp/compact-candidate.txt
      - name: Gather evidence
        if: always()
        run: |
          mkdir -p /tmp/compact-evidence
          cp /tmp/compact-tests.log /tmp/compact-static-audit.json /tmp/compact-cli-help.txt /tmp/compact-notebooks-preserved.json /tmp/compact-candidate.txt /tmp/compact-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-plot-validation
          path: /tmp/compact-evidence
          retention-days: 7
