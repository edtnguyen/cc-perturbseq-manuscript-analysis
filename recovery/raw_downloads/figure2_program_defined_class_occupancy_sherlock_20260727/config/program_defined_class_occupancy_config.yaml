query_h5ad: /oak/stanford/groups/engreitz/Users/opushkar/cc_perturb/2.preprocessing_tonys_pipeline/3.integrated_days/3.all_days_concat_pc30_all_genes_sceptre_guides.h5ad
guide_metadata_tsv: templates/300genes_guide_metadata_v43.tsv
class_membership_tsv: templates/class_membership_reviewed_screen_hits.tsv
curated_program_states_tsv: templates/curated_program_states.tsv
export_dir: program_defined_occupancy_export
output_dir: program_defined_occupancy_results

day_col: day
replicate_col: biological_sample
guide_assignment_key: guide_assignment
guide_names_key: guide_names
program_usage_source: auto
program_obs_prefix: 'Program '
program_obsm_key: cnmf_usage
n_programs: 50

# Primary state rule:
# 1) take the global argmax over all 50 cNMF programs;
# 2) retain a cell as a primary state only when the argmax program is marked
#    use_in_primary=TRUE and its expected day matches the observed collection day.
state_assignment_rule: global_argmax_then_primary_curated_expected_day
minimum_dominant_fraction: 0.0
minimum_dominance_margin: 0.0
analysis_population: primary_curated_dominant_expected_day
run_all_day_cells_sensitivity: true
run_expanded_curated_sensitivity: true

covariates:
  - pct_counts_mt
  - biological_sample
  - total_counts
  - guides_per_cell
  - guide_umi_counts
  - n_genes_by_counts
minimum_carrier_cells_per_day: 25
minimum_program_state_cells_per_day: 25
minimum_carrier_state_cells: 3
minimum_carrier_nonstate_cells: 3
minimum_noncarrier_state_cells: 10
minimum_targets_per_class: 4
maximum_standard_error_for_class_summary: 3.0
maximum_abs_log_odds_for_class_summary: 8.0
fdr_threshold: 0.05
fdr_family: within_day
n_jobs: 8
