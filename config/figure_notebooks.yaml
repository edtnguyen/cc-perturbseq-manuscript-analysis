figures:
  Figure_01:
    title: Figure 1 — A time-resolved map of regulators and gene programs during arterial endothelial differentiation
    scope: Panels a–d
    manuscript: Working CC-Perturb-seq EC Differentiation - Text V3
    panels:
    - panel: a
      description: Experimental framework schematic
      type: manual_asset
      required_inputs:
      - assets.figure1a_schematic
      candidate_sources:
      - Editable source artwork or deliberate redraw
    - panel: b
      description: Genome-wide CRISPRi screen volcano plot
      type: code
      required_inputs:
      - screen.genomewide_mageck_pos_vs_neg
      - screen.genomewide_utest_pos_vs_neg
      candidate_sources:
      - recovery/raw_downloads/Pos_vs_Neg_volcano_plotnine_MAGECK_FDR_pathway_colored_v4_bundle/Pos_vs_Neg_volcano_plotnine_MAGECK_FDR_pathway_colored_v4.py
      - recovery/raw_downloads/make_genomewide_screen_volcano_final.py
    - panel: c
      description: Estimated Day 3 EC fraction for selected genes
      type: code
      required_inputs:
      - ccperturbseq.d3_anndata
      - ccperturbseq.guide_assignment
      - ccperturbseq.ec_fraction_table
      candidate_sources:
      - guide-level EC-percentage and permutation-test scripts in the recovery branch
    - panel: d
      description: Integrated D0–D3 UMAP colored by selected cNMF program
      type: code
      required_inputs:
      - ccperturbseq.integrated_anndata
      - ccperturbseq.cnmf_usage
      - ccperturbseq.program_annotations
      candidate_sources:
      - integrated-state-atlas and program-annotation notebooks in the recovery branches
