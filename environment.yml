# Complete environment for the seven published figure notebooks, public
# downloads, compact-table exports, tests and optional processed-GEO regeneration.
# Create a NEW environment; do not install over the original sc-dl environment.
# Scientific pins match config/geo-reproduction-requirements.txt.
name: ccperturbseq-figures
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.3.3
      - anndata==0.11.4
      - mudata==0.3.2
      - scanpy==1.11.1
      - scipy==1.17.1
      - scikit-learn==1.5.2
      - h5py==3.16.0
      - zarr==2.18.7
      - numcodecs==0.15.2
      - matplotlib==3.11.2
      - seaborn==0.13.2
      - plotnine==0.15.8
      - mizani==0.14.6
      - numba==0.68.1
      - umap-learn==0.5.7
      - pynndescent==0.7.0
      - igraph==1.0.0
      - leidenalg==0.12.0
      - openpyxl==3.1.5
      - PyYAML==6.0.3
      - nbformat==5.11.1
      - nbclient==0.11.0
      - ipykernel==7.4.0
      - pytest==9.2.0
      - muon==0.1.7
      - logomaker==0.8.7
      - statsmodels>=0.14.5,<0.15
      - ipython>=9,<10
      - jupyter-client>=8.6,<9
      - jupyterlab>=4.4,<5
      - packaging>=24,<27
